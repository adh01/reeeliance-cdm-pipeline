name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest -v

      - name: Run the pipeline end to end
        run: python src/main.py

      - name: Check that all outputs exist
        run: |
          test -f cdm_lakehouse/Contact/Contact.csv
          test -f cdm_lakehouse/SalesOrder/SalesOrder.csv
          test -f cdm_lakehouse/model.json
          python -c "import json; json.load(open('cdm_lakehouse/model.json'))"
